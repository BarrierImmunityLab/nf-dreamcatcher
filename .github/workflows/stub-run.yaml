name: stub-run
on:
  push:
    branches: [main]

jobs:
  stub-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.10.4"
      - name: Stub run
        run: nextflow run main.nf -profile stub -stub-run
      - name: Upload Nextflow log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-log
          path: .nextflow.log
